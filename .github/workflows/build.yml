name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      # Never expose signing secrets to pull requests or build logs. Release signing,
      # if needed, must be performed offline or in a separately protected pipeline.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meng-release-apk
          path: app/build/outputs/apk/release/*.apk
